[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metareason-torch"
version = "1.1.0"
description = "Meta-learning (MAML/FOMAML, ProtoNets, ANIL), continual learning (EWC) and verified neurosymbolic reasoning in PyTorch"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cyb0rg137ms" }]
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
stats = ["scipy>=1.11"]
dev = ["pytest>=8", "pytest-timeout", "ruff", "mypy", "matplotlib>=3.7", "scipy>=1.11"]

[project.scripts]
metareason = "metareason.cli:main"

[tool.setuptools.packages.find]
include = ["metareason*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E731", "RUF001", "RUF002", "RUF003", "B023"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=300"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
